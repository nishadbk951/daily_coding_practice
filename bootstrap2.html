<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap components</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--NAVBAR START-->
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <!-- brand name-->
             <a class="navbar-brand fw-bold" href="#">
                mywebsite
             </a>
             <!--menu items-->
             <ul class="navbar-nav d-flex flex-row">
                <li class="nav-item mx-3">
                    <a class="nav-link active" href="#">Home</a>
                </li>
                <li class="nav-item mx-3">
                    <a class="nav-link" href="#">About</a>
                </li>
                <li class="nav-item mx-3">
                    <a class="nav-link" href="#">Contact</a>
                </li>
             </ul>
        </div>
    </nav>
    <!----========== NAVBAR END ===========-->
    <!--============ MAIN CINTAINER START-->

    <div class="container mt-5">
        <!--heading-->
        <h1 class="text-center mb-4">
            bootstrap components
        </h1>

        <!--========== BUTTON SECTION========-->
        <h2 class="mb-3">buttons</h2>
        <button class="btn btn-primary">
            primary button
        </button>
        <button class="btn btn-success">
            success button
        </button>
        <button class="btn btn-danger">
            danger button
        </button>
        <button class="btn btn-warning">
            warning button
        </button>
        <button class="btn btn-secondary">
            dark button
        </button>
        <!--============= BUTTON GROUP SECTION=========== -->

        <h2 class="mt-5 mb-3">button group</h2>
        <div class="btn-group">
            <button class="btn btn-primary">Left</button>
            <button class="btn btn-primary">Middle</button>
            <button class="btn btn-primary">Right</button>
        </div>
        <!--============= ALERTS SECTION========= -->

        <h2 class="mt-5 mb-3">Alerts</h2>
        <div class="alert alert-success">Data saved successfully!       
        </div>
        <div class="alert alert-danger">Error occurred!
        </div>
        <div class="alert alert-warning">warning! please check your input.</div>
        <!--alert = primary,secondary, info -->

        <!--============= BADGES SECTION =========== -->
        <h2 class="mt-5 mb-3">Badges</h2>
        <h4>Notifications <span class="badge bg-primary">5</span></h4>
        <h4 class="mt-3">Messages<span class="badge bg-success">10</span></h4>
        <h4 class="mt-3">Pending Tasks<span class="badge bg-danger">3</span></h4>
    </div>
    <!--============== MAIN CONTAINER END ========== -->  
</body>
</html>
