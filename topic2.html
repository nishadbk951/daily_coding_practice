<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attribute Selectors Example</title>
    <link rel="stylesheet" href="topic2.css">
</head>
<body>

    <h1>Attribute Selectors Example</h1>

    <!-- type="text" selector -->
    <input type="text" placeholder="Enter your name">

    <input type="password" placeholder="Enter password">

    <br><br>

    <!-- href^="https" selector -->
    <a href="https://www.google.com">Google (HTTPS Link)</a>

    <br><br>

    <!-- href$=".pdf" selector -->
    <a href="notes.pdf">Download PDF Notes</a>

</body>
</html>
