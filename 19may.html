<!DOCTYPE html>
<html>
    <head>
        <style>
            span {
                display: inline;
                background-color: yellow;
                width: 200px;
                height: 100px;
            }
            div{
                display:block;
                background-color: lightblue;
                width: 300px;
                height: 80px;
                margin: 10px;
            }

                .box {
                    display: inline-block;
                    width: 150px;
                    height: 100px;
                    background-color: coral;
                    margin: 10px;
                }

                .hide {
                    display: none;                  
                }

                .invisible {
                    visibility: hidden;
                }

                .container{
                    display: flex;
                    background-color: lightgray;
                }

                .boxx {
                    background-color: teal;
                    color: white;
                    padding: 20px;
                    margin: 10px;
                }

            
        </style>
    </head>
    <body>

        <span>Item 1</span>
        <span>Item 2</span>
        <span>Item 3</span>

        <div>Box 1</div>
        <div>Box 2</div>
        <div>Boc 3</div>

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>

        <p>This is visible</p>
        <p class="hide">This is hidden</p>

        <p>This is visible</p>
        <p class="invisible">This is invisible but takes space</p>

        <div class="container">
            <div class="boxx">flex box 1</div>
            <div class="boxx">2</div>
            ><div class="boxx">3</div>
        </div>
    </body>
</html>
