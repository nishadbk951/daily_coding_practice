<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text_style {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <h1 id="demo">hello</h1>
    <p class="text">welcome</p>
    <p id="text">hy</p>
    <p id="textcontent">hy</p>
    <span>good afternoon</span>
    <p>one</p>
    <p>two</p>
    <ul id="list">
        <li>apple</li>
        <li>orange</li>
    </ul>
    
</body>
<script>
    let em = document.getElementById("demo");
    em.innerHTML = "hello students";

    let para = document.querySelector(".text");
    console.log(para)
    let paragra = document.querySelector("#text");
    console.log(paragra)

    let paragraph = document.querySelector("span");
    console.log(paragraph)

    let p = document.querySelector("p");
    console.log(p)

    let p_all = document.querySelectorAll("p");
    console.log(p_all[3]);

    document.getElementById("text").innerHTML = "<i>welcome</i>";

    document.getElementById("textcontent").textContent = "<i>welcome</i>";

    // classList.add() - adds a css class

    let paraga = document.querySelector(".text");

    paraga.classList.add("text_style");

    paraga.classList.remove("text_style");

    paraga.classList.toggle("text_style");

    // create element()
    let heading = document.createElement("h1");
    heading.textContent = "hello"
    console.log(heading)

    // appendchild()
    document.body.appendChild(heading);

    // removechild()

    let list = document.getElementById("list");
    let item = list.children[1];
    list.removeChild(item)



    // work 

    
    
</script>
</html>
