<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        .error{
            color:red;
            font-size: 14px;
        }
        .success{
            color:green;
        }
        input {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h2>Registration Form</h2>
    <form id="registerForm">
        <label>Name:</label>
        <input type="text" id="name">
        <p id="nameError" class="error"></p>
        <label>Email:</label>
        <input type="text" id="email">
        <p id="emailError" class="error"></p>
        <label>Phone:</label>
        <input type="text" id="phone">
        <p id="phoneError" class="error"></p>
        <label>password:</label>
        <input type="password" id="password">
        <p id="passwordError" class="error"></p>
        <button type="submit">Register</button>
    </form>
    <p id="successMessage" class="success"></p>  
</body>
<script>
    let form = document.getElementById("registerForm");
    form.addEventListener("submit",function(event){
        event.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let password = document.getElementById("password").value.trim();

        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");
        let phoneError = document.getElementById("phoneError");
        let passwordError = document.getElementById("passwordError");
        let successMessage = document.getElementById("successMessage");

        nameError.textContent = "";
        emailError.textContent = "";
        phoneError.textContent = "";
        passwordError.textContent = "";
        successMessage.textContent = "";

        let namePattern = /^[A-Za-z ]{3,}$/;
        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        let phonePattern = /^[6-9]\d{9}$/;
        let passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$/;


        let isValid = true;

        if (name === "") {
            nameError.textContent = "Name is required";
            isValid = false;
        } else if (!namePattern.test(name)) {
            nameError.textContent = "Enter a valid name";
            isValid = false;
        }

        if (email === ""){
            emailError.textContent = "Email is required";
            isValid = false;
        }else if (!emailPattern.test(email)){
            emailError.textContent = "Enter a valid mail";
            isValid = false;
        }

        if (phone === ""){
            phoneError.textContent = "Phone number is required";
            isValid = false;
        }else if (!phonePattern.test(phone)) {
            phoneError.textContent = "Enter a valid 10 digit phone number";
            isValid = false;
        }

        if (password === ""){
            passwordError.textContent = "Password is Required";
            isValid = false;
        } else if (!passwordPattern.test(password)){
            passwordError.textContent = "Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, and one number.";
            isValid = false;
        }

        if(isValid){
           // store registration details
           let user = {
               name: name,
               email:email,
               phone: phone,
               password: password
           };

           localStorage.setItem("user", JSON.stringify(user));
           successMessage.textContent = 
               "Registration successful! Redirecting to login...";
            form.reset(); 
           
           //Navigate to login page
           setTimeout(() => {
             window.location.href = "login.html";
           },1000);
        }
    });
</script>
</html>
