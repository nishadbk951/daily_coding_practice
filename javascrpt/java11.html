<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>click,dbclick,input,change,submit,keyup,mouseover,mouseout,load</p>
    <input type="text" id="name" placeholder="enter your name:">
    <form action="post" id="myform">
        <input type="text">
        <button>click</button>
    </form>
    <button id="btn">click me</button>

    <div id="parent">
        <button id="child">darkmode</button>
    </div>
    
</body>
<script>
     let button = document.getElementById("btn");

     button.addEventListener("click",
         function(e){
             console.log(e.type)
         } );

     let input = document.getElementById("name");
     input.addEventListener("input",
         function(){
             console.log(input.value)
         });

     let form = document.getElementById("myform");
     form.addEventListener("submit",
         function(e){
             e.preventDefault();
             console.log("form submitted");
        });
        
    
    document.addEventListener("keydown",
        function(event){
            console.log(event.key);
        });

    let pbutton = document.getElementById("parent");
    pbutton.addEventListener("click",
        function(){
            console.log("parent");
        });
        
    let cbutton = document.getElementById("child");
    cbutton.addEventListener("click",
        function(e){
            e.stopPropagation();
            document.body.style.background="black";
            document.body.style.color="white";
            console.log("child");
        });  



    
</script>
</html>
