<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator</title>
    <link rel="stylesheet" href="translation.css">
    <script src="translation.js" defer></script>
</head>

<body>

    <div class="container">
      
        <h1>🌐 AI Language Translator</h1>

        <div class="translator-box">

            
            <textarea id="inputText" placeholder="Enter text here...">
            </textarea>

           <textarea  id="result" placeholder="Translation will appear here..." readonly>
            </textarea>

        </div>

        <div class="controls">        
            <select id="language">

                <option value="ml">Malayalam</option>
                <option value="hi">Hindi</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="ar">Arabic</option>
                <option value="de">Germany</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>

            </select>

           
            <button id="translateBtn">Translate</button>
           
            <button id="swapBtn">Swap</button>

           <button id="copyBtn">Copy</button>
            
            <button id="voiceBtn">Voice Input</button>
            
            <button id="speakBtn">Speak</button>

        </div>


    </div>


</body>

</html>
