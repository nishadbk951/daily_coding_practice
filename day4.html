<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1> USER REGISTRATION FORM</h1>
    <form action="#" method="post">
        <label>Full name:</label> 
        <input type="text" name="fname" placeholder="enter your name" required><br><br>
        <label>Email:</label>
        <input type="email" name="email"><br><br>
        <label>phone number:</label>
        <input type="tel" name="phone"><br><br>
        <label>password:</label>
        <input type="password" name="password"><br><br>
        <label>age:</label>
        <input type="number" name="age"><br><br>
        <label>Dob:</label>
        <input type="date" name="Dob"><br><br>
        <label>file</label>
        <input type="file" name="fileup"><br><br>
        <label>Gender</label>
        <input type="radio" name="GENDER" value="male">male
        <input type="radio" name="GENDER" value="female">female
        <br><br>
        <label>SKILLS</label>
        <input type="checkbox" name="skills" value="html">HTML
        <input type="checkbox" name="skills" value="css">CSS
        <input type="checkbox" name="skills" value="python">PYTHON
        <input type="checkbox" name="skills" value="java">JAVA <br><br>
        <label>Address</label>
        <textarea name="address" rows="4" cols="30"></textarea><br><br>
        <label>COURSE</label>
        <select name="COURSE">
        <option value="pfs">PFS</option>
        <option value="dsa">DSA</option>
        <option value="da">DA</option>
        </select><br><br>


        <input type="submit" value="Register">
        <input type="reset" value="clear">
    </form>

</body>
</html>
