<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>STUDENT REGISTRATION FORM</h1>
    <form action="#" method="post">
        <label>full name:</label>
        <input type="text" name="fname" placeholder="enter your full name" required><br><br>
        <label>Email:</label>
        <input type="email" name="email" required><br><br>
        <label>Phone number:</label>
        <input type="tel" name="phone number"><br><br>
        <label>AGE</label>
        <input type="number" name="age"><br><br>
        <label>GENDER:</label>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female">female
        <br><br>
        <label>COURSE:</label>
        <input type="checkbox" name="course" value="dsa">DSA
        <input type="checkbox" name="course" value="male">PFS
        <input type="checkbox" name="course" value="male">DA
        <input type="checkbox" name="course" value="male">JAVA
        <br><br>
        <label>language</label>
        <select name="language">
            <option value="english">english</option>
            <option value="hindi">hindi</option>
            <option value="arabic">arabic</option>
        </select>
        <br><br>
        <input type="submit" value="register">
        
        
    </form>
</body>
</html>
